name: Platform builds

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    # Never run pull requests from forks on the self-hosted homelab runner.
    # build and apple-build need this job, so they are skipped as well.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, bopomofo-linux]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux test dependencies
        timeout-minutes: 10
        run: |
          set -euo pipefail
          apt_options=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${apt_options[@]}" -o APT::Update::Error-Mode=any update
          sudo apt-get "${apt_options[@]}" install -y clang cmake ninja-build pkg-config libgtk-3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev xvfb
      - name: Resolve workspace
        run: dart pub get
      - name: Resolve Flutter app
        working-directory: app/bopomofo
        run: flutter pub get
      - name: Package analysis
        shell: bash
        run: |
          set -euo pipefail
          for package in packages/domain packages/phonology packages/content packages/srs packages/learning_engine; do
            (cd $package && dart analyze)
          done
          for package in packages/persistence packages/auth packages/sync packages/design_system; do
            (cd $package && flutter analyze)
          done
      - name: Package tests
        shell: bash
        run: |
          set -euo pipefail
          for package in packages/domain packages/phonology packages/content packages/srs packages/learning_engine; do
            (cd $package && dart test)
          done
          for package in packages/persistence packages/auth packages/sync; do
            (cd $package && flutter test)
          done
      - name: Flutter analyze
        working-directory: app/bopomofo
        run: flutter analyze
      - name: Flutter tests
        working-directory: app/bopomofo
        run: flutter test
      - name: Offline integration test
        working-directory: app/bopomofo
        run: xvfb-run -a flutter test integration_test/offline_learning_test.dart -d linux
      - name: Multi-device integration test
        working-directory: app/bopomofo
        run: xvfb-run -a flutter test integration_test/multi_device_merge_test.dart -d linux

  build:
    needs: quality
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: [self-hosted, bopomofo-linux]
            target: linux
            command: flutter build linux --debug
          - os: [self-hosted, bopomofo-linux]
            target: android
            command: flutter build apk --debug $DART_DEFINES_ARG
          - os: windows-latest
            target: windows
            command: flutter build windows --debug
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux desktop build dependencies
        if: matrix.target == 'linux'
        timeout-minutes: 10
        run: |
          set -euo pipefail
          apt_options=(-o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30)
          sudo apt-get "${apt_options[@]}" -o APT::Update::Error-Mode=any update
          sudo apt-get "${apt_options[@]}" install -y clang cmake ninja-build pkg-config libgtk-3-dev libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev
      - name: Set up Java
        if: matrix.target == 'android'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Android SDK
        if: matrix.target == 'android'
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Resolve workspace
        run: dart pub get
      - name: Resolve app
        working-directory: app/bopomofo
        run: flutter pub get
      # Windows and Linux do not register the OAuth callback scheme yet, so
      # they build without Supabase values and run in guest mode.
      - name: Write dart defines
        if: matrix.target == 'android'
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          GOOGLE_OAUTH_REDIRECT_URI: ${{ secrets.GOOGLE_OAUTH_REDIRECT_URI }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
        run: bash tool/write_dart_defines.sh
      - name: Build ${{ matrix.target }}
        working-directory: app/bopomofo
        run: ${{ matrix.command }}

  apple-build:
    needs: quality
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: macos
            command: flutter build macos --debug $DART_DEFINES_ARG
          - target: ios
            command: flutter build ios --debug --no-codesign $DART_DEFINES_ARG
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Resolve workspace
        run: dart pub get
      - name: Resolve app
        working-directory: app/bopomofo
        run: flutter pub get
      - name: Write dart defines
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          GOOGLE_OAUTH_REDIRECT_URI: ${{ secrets.GOOGLE_OAUTH_REDIRECT_URI }}
        run: bash tool/write_dart_defines.sh
      - name: Build ${{ matrix.target }}
        working-directory: app/bopomofo
        run: ${{ matrix.command }}
