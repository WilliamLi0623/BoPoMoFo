name: Android pre-release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/ci.yml

  build-and-release:
    needs: quality
    runs-on: [self-hosted, bopomofo-linux]
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure repository remains private
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          is_private="$(gh api "repos/$GITHUB_REPOSITORY" --jq .private)"
          if [[ "$is_private" != 'true' ]]; then
            echo 'Refusing to publish: the repository is not private.' >&2
            exit 1
          fi
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          # AGP 9.3 release lint calls List.removeLast(), which needs JDK 21.
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?(\+([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$ ]]; then
            echo "Tag must be a semantic version such as v0.1.0; got: $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - name: Resolve workspace
        run: dart pub get
      - name: Resolve Flutter app and generate localizations
        working-directory: app/bopomofo
        run: |
          flutter pub get
          flutter gen-l10n
      - name: Configure Android upload signing
        shell: bash
        env:
          ANDROID_UPLOAD_KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE }}
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [[ -z "$ANDROID_UPLOAD_KEYSTORE_BASE64" || -z "$ANDROID_UPLOAD_STORE_PASSWORD" ]]; then
            echo 'Missing ANDROID_UPLOAD_KEYSTORE or ANDROID_UPLOAD_STORE_PASSWORD repository secret.' >&2
            exit 1
          fi
          keystore="$GITHUB_WORKSPACE/app/bopomofo/android/app/upload-keystore.jks"
          printf '%s' "$ANDROID_UPLOAD_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          echo "ANDROID_UPLOAD_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"
          echo 'ANDROID_UPLOAD_KEY_ALIAS=bopomofo-upload' >> "$GITHUB_ENV"
      - name: Write dart defines
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_PUBLISHABLE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
          GOOGLE_OAUTH_REDIRECT_URI: ${{ secrets.GOOGLE_OAUTH_REDIRECT_URI }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
        run: bash tool/write_dart_defines.sh
      - name: Build and verify signed APK
        working-directory: app/bopomofo
        env:
          ANDROID_UPLOAD_STORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_STORE_PASSWORD }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          flutter build apk --release \
            --build-name="$version" \
            # Run 6 published v0.2.1 as versionCode 6, but signed test builds
          # already reached versionCode 9 (0.2.2-test.paths1). The offset
          # keeps every new release at least one above the highest test
          # build while staying monotonic with run numbers.
          --build-number="$((GITHUB_RUN_NUMBER + 3))" \
            ${DART_DEFINES_ARG:-}
          apk='build/app/outputs/flutter-apk/app-release.apk'
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$apksigner"
          "$apksigner" verify --verbose "$apk"
          sha256sum "$apk" > "$apk.sha256"
          echo "ANDROID_RELEASE_APK=$GITHUB_WORKSPACE/app/bopomofo/$apk" >> "$GITHUB_ENV"
          echo "ANDROID_RELEASE_CHECKSUM=$GITHUB_WORKSPACE/app/bopomofo/$apk.sha256" >> "$GITHUB_ENV"
      - name: Publish private GitHub pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$ANDROID_RELEASE_APK" \
            "$ANDROID_RELEASE_CHECKSUM" \
            --verify-tag \
            --prerelease \
            --title "BoPoMoFo $GITHUB_REF_NAME" \
            --generate-notes
      - name: Remove signing key from runner
        if: always()
        run: rm -f app/bopomofo/android/app/upload-keystore.jks
