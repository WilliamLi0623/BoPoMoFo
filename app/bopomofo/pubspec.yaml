name: bopomofo
description: The Bopomofo local-first learning app.
publish_to: none
resolution: workspace

environment:
  sdk: '>=3.6.0 <4.0.0'
  flutter: '>=3.50.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  material_ui: ^1.11.0
  auth:
    path: ../../packages/auth
  audioplayers: ^6.8.1
  design_system:
    path: ../../packages/design_system
  domain:
    path: ../../packages/domain
  learning_engine:
    path: ../../packages/learning_engine
  path_provider: ^2.1.5
  persistence:
    path: ../../packages/persistence
  phonology:
    path: ../../packages/phonology
  sync:
    path: ../../packages/sync
  shared_preferences: ^2.3.3

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_test:
    sdk: flutter

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/audio/
